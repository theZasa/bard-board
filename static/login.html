<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Anmelden · Soundboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // Same theme as the web interface (stored as JSON by app.js), before the first paint.
    try {
      const t = JSON.parse(localStorage.getItem("theme"));
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="favicon.svg" alt="" width="32" height="32">
      <span>Soundboard</span>
      <span class="login-platform" id="platform"></span>
    </div>

    <section id="step-start" hidden>
      <h1>Anmelden</h1>
      <button class="btn btn-primary login-wide" id="passkey-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11V7a4 4 0 0 0-8 0v4M2 11h12v10H2zM18 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 6v8m0-3h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Mit Passkey anmelden
      </button>
      <p class="muted small login-note" id="passkey-note" hidden></p>
      <div class="login-or"><span>oder</span></div>
      <button class="btn login-wide" id="code-btn" type="button"></button>
    </section>

    <section id="step-code" hidden>
      <h1>Code an den Bot schicken</h1>
      <p class="muted" id="code-how"></p>
      <div class="login-code">
        <code id="code-command"></code>
        <button class="btn btn-icon" id="copy-btn" type="button" title="Kopieren" aria-label="Befehl kopieren">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h11v11H9zM5 15H4V4h11v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="muted small login-wait"><span class="login-spinner" aria-hidden="true"></span><span id="code-wait">Warte auf den Bot …</span></p>
      <button class="btn btn-sm-text login-back" id="code-back" type="button">Zurück</button>
    </section>

    <section id="step-passkey" hidden>
      <h1 id="hello"></h1>
      <p>Leg jetzt einen Passkey für dieses Gerät an. Nächstes Mal meldest du dich dann mit Fingerabdruck, Gesichtserkennung oder PIN an, ohne Code, und bleibst 30 Tage angemeldet.</p>
      <button class="btn btn-primary login-wide" id="create-btn" type="button">Passkey anlegen</button>
      <button class="login-skip" id="skip-btn" type="button">Ohne Passkey weiter, nur für heute</button>
    </section>

    <p class="login-error" id="error" role="alert" hidden></p>
  </main>
  <script src="passkey.js"></script>
  <script src="login.js"></script>
</body>
</html>
