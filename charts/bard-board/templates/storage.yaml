{{- $fullname := include "bard-board.fullname" . -}}
{{- with .Values.persistence.sounds }}
{{- if not .existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-sounds
  labels:
    {{- include "bard-board.labels" $ | nindent 4 }}
  annotations:
    # Hochgeladene Sounds überleben ein "helm uninstall".
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .accessMode | quote }}]
  {{- with .storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
{{- with .Values.persistence.collections }}
{{- if and .enabled (not .existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-collections
  labels:
    {{- include "bard-board.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .accessMode | quote }}]
  {{- with .storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
