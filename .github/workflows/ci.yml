name: CI

# Jeder Push und Pull Request wird geprüft. Auf main und bei Tags (v1.2.3) entstehen Image und Chart
# in der GitHub Container Registry. yt-dlp hält der Bot selbst aktuell (app/updater.py), dafür braucht
# es kein neues Image. Ausgerollt wird nicht von hier: Der Cluster folgt dem Tag "latest" und startet
# nach jedem Build selbst neu; das Helm-Chart bleibt dabei unverändert.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff
        run: |
          pip install "ruff>=0.12,<1"
          ruff check .
      - name: Shell-Skripte
        run: shellcheck tools/ci/*.sh
      - name: JavaScript-Syntax
        run: for f in static/*.js; do node --check "$f"; done

  e2e:
    name: End-to-End (echter Mumble-Server)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MURMUR_SUPERUSER_PASSWORD: ci-superuser
      YTDLP_AUTO_UPDATE: "false"
      TTS_MODEL: ${{ github.workspace }}/.ci/voice.onnx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Systempakete und Mumble-Server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0 mumble-server
          # Das Paket startet einen eigenen Dienst auf Port 64738; der Test bringt seinen eigenen mit.
          sudo systemctl disable --now mumble-server || true
      - name: Python-Pakete
        run: pip install -r requirements.txt -r requirements-discord.txt
      - name: Stimme für die Sprachausgabe
        uses: actions/cache@v6
        with:
          path: .ci
          key: piper-thorsten-high-v1
      - name: Stimme laden
        run: |
          mkdir -p .ci
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx
          [ -f .ci/voice.onnx ] || curl -fsSL -o .ci/voice.onnx "$base"
          [ -f .ci/voice.onnx.json ] || curl -fsSL -o .ci/voice.onnx.json "$base.json"
      - name: Test-Sounds und Mumble-Server
        run: |
          python tools/make_test_sounds.py "$RUNNER_TEMP/sounds"
          sh tools/ci/murmur.sh start
      - name: End-to-End-Test
        run: >
          python tools/e2e_test.py
          --superuser-password "$MURMUR_SUPERUSER_PASSWORD"
          --sounds "$RUNNER_TEMP/sounds"
          --restart-cmd "sh tools/ci/murmur.sh restart"
      - name: Logs bei Fehler
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            /tmp/sb-e2e-*/bot.log
            /tmp/murmur-ci/murmur.log
          if-no-files-found: ignore

  helm:
    name: Helm-Chart prüfen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint und Schema-Prüfung
        run: |
          helm lint charts/bard-board -f charts/bard-board/ci/test-values.yaml --strict
          for values in charts/bard-board/ci/test-values.yaml deploy/values.example.yaml; do
            helm template ci charts/bard-board -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
          done
      - name: Pflichtangaben werden erzwungen
        run: |
          # Ohne Secret-Namen oder ohne Passwort bei öffentlichem Ingress darf das Chart nicht rendern.
          if helm template ci charts/bard-board > /dev/null; then
            echo "::error::Chart rendert ohne mumble.existingSecret"; exit 1
          fi
          if helm template ci charts/bard-board --set mumble.existingSecret=x --set ingress.enabled=true > /dev/null; then
            echo "::error::Chart rendert einen öffentlichen Ingress ohne Passwort"; exit 1
          fi

  # Runs in parallel to the other checks: builds, runs the unit tests inside the image and pushes it
  # under its sha tag only. "latest" (what the cluster runs) is set by "publish" once everything passed.
  image:
    name: Image bauen und testen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Unveränderlicher Tag und Version für dieses Image
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Bauen (lokal, zum Testen)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bard-board:ci
          build-args: |
            BARD_BOARD_REVISION=${{ github.sha }}
            BARD_BOARD_DATE=${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit-Tests im Image
        run: docker run --rm bard-board:ci python -m unittest discover -s tests -t .
      - name: Image testen
        run: |
          docker run --rm bard-board:ci python -c "import discord, davey, nacl; print('Discord-Sprache verfügbar')"
          # Die Versionsanzeige (Webinterface und /help) nennt genau diesen Commit.
          docker run --rm bard-board:ci python -c "from app import version; print(version.describe())" | tee /dev/stderr | grep -q "${GITHUB_SHA::7}"
          # Startet ohne Mumble-Server, öffentlich (WEB_PASSWORD): nur Anmeldeseite und /healthz sind offen,
          # das alte gemeinsame Passwort gilt nicht mehr.
          docker run -d --name smoke -p 8080:8080 -e MUMBLE_HOST=127.0.0.1 -e WEB_PASSWORD=ci -e YTDLP_AUTO_UPDATE=false bard-board:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u x:ci http://127.0.0.1:8080/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login.html)" = 200
          curl -fs http://127.0.0.1:8080/auth/status | grep -q '"enabled":true'
          curl -fs -X POST http://127.0.0.1:8080/auth/code | grep -q '"code"'
          docker logs smoke
          docker rm -f smoke
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Image heißt wie das Repository, z. B. ghcr.io/thezasa/bard-board
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.tag.outputs.tag }}
      - name: Anmelden bei GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hochladen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BARD_BOARD_REVISION=${{ github.sha }}
            BARD_BOARD_DATE=${{ steps.tag.outputs.date }}
          cache-from: type=gha

  # Only now the image goes live: "latest" (and "main", version tags) point to the tested sha image.
  # Retagging in the registry takes seconds, nothing is built again.
  publish:
    name: Freigeben
    if: github.event_name != 'pull_request'
    needs: [image, e2e, lint, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Anmelden bei GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Getestetes Image freigeben
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$image:$SOURCE_TAG"
          echo "Freigegeben: $(echo "$TAGS" | tr '\n' ' ')"

  chart:
    name: Chart veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Paketieren und hochladen
        run: |
          version=${GITHUB_REF_NAME#v}
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          helm package charts/bard-board --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "bard-board-$version.tgz" "oci://ghcr.io/$owner/charts"
